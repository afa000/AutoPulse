spring.application.name=AutoPulse
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/autopulse}
spring.datasource.username=${DATABASE_USER:iamnetgo}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
# Explicit opt-in while checkpoint 2 is being verified; local profile does not override it.
autopulse.trip-processing.enabled=false
# Explicit bounded retention only; no scheduler/startup invocation. Keep both safe defaults.
autopulse.retention.enabled=false
autopulse.retention.dry-run=true
autopulse.retention.raw-days=30
autopulse.retention.receipt-hold-hours=96
# Opt-in cached whole-vehicle aggregate reader. Expired ranges are always explicit.
autopulse.history.owned-aggregates-enabled=false
# Separate bounded diagnostic queue worker; local profile must not enable it implicitly.
autopulse.diagnostics.processing-enabled=false
autopulse.maintenance.processing-enabled=false
