name: Verify telemetry pipeline

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: web
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: web
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./device-agent
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Live, trip-retention, numeric and care browsers through disposable Java and PostgreSQL
        run: bash ./mvnw --batch-mode test -Dtest=DashboardBrowserDemo,TripMilestoneDemo,NumericAnalyticsDemo,CareBrowserDemo,CareMilestoneDemo -Dautopulse.python=python
        working-directory: server
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported runtime and the runtime with observed parser differences.
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: device-agent/pyproject.toml
      - run: python -m pip install -e './device-agent[dev]'
      - run: python -m pytest device-agent/tests

  java-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - run: docker info --format '{{.ServerVersion}}'
      - name: Java tests with real disposable PostgreSQL
        working-directory: server
        run: bash ./mvnw --batch-mode test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e './device-agent[dev]'
      - name: Actual diagnostic HTTP responses match shared schemas
        run: python scripts/verify_diagnostic_http.py
      - name: Actual maintenance HTTP responses match shared schemas
        run: python scripts/verify_maintenance_http.py
      - name: Cross-runtime commute and interrupted-ack demonstration
        working-directory: server
        run: bash ./mvnw --batch-mode test -Dtest=CommuteDemo -Dautopulse.python=python
